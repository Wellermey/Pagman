name: build

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.ui }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ui: [tui]

    steps:
      - uses: actions/checkout@v4

      - name: Зависимости (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Зависимости (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install pdcurses

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          fi
          cmake -S . -B build -DUI=${{ matrix.ui }} -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build build --config Release
